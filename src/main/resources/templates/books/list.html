<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="stylesheet" href="/css/style.css"><title>Danh sách sách</title></head><body><div class="nav"><a href="/books">BookStore AI</a><div><a href="/books">Sách</a><a href="/ai">Hỏi AI</a><a href="/orders/my">Đơn hàng</a><a href="/admin/books">Admin</a><a href="/login">Đăng nhập</a><form th:action="@{/logout}" method="post" style="display:inline"><button class="linkbtn">Đăng xuất</button></form></div></div>
<div class="container"><div class="hero"><h1>Website bán sách</h1><p>Spring Boot + Spring Security + MySQL + Spring AI Gemini</p></div>
<form class="search" th:action="@{/books/search}" method="get"><input name="keyword" th:value="${keyword}" placeholder="Tìm sách theo tên..."><button>Tìm kiếm</button></form>
<div class="grid">
<div class="book-card" th:each="book : ${books}"><img th:src="${book.coverImage != null && !book.coverImage.isBlank() ? book.coverImage : 'https://picsum.photos/seed/book/300/420'}" alt="cover"><h3 th:text="${book.title}">Tên sách</h3><p th:text="'Tác giả: ' + ${book.author}"></p><p class="price" th:text="${#numbers.formatDecimal(book.price,0,'COMMA',0,'POINT')} + ' đ'"></p><p th:text="'Tồn kho: ' + ${book.quantity}"></p><a class="btn" th:href="@{/orders/checkout/{id}(id=${book.id})}">Mua sách</a></div>
</div></div></body></html>
