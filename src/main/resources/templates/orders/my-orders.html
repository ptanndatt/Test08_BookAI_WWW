<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="stylesheet" href="/css/style.css"><title>Đơn hàng</title></head><body><div class="nav"><a href="/books">BookStore AI</a><div><a href="/books">Sách</a><a href="/ai">Hỏi AI</a><a href="/orders/my">Đơn hàng</a><a href="/admin/books">Admin</a><a href="/login">Đăng nhập</a><form th:action="@{/logout}" method="post" style="display:inline"><button class="linkbtn">Đăng xuất</button></form></div></div>
<div class="container"><h1>Đơn hàng của tôi</h1><table><thead><tr><th>ID</th><th>Ngày đặt</th><th>Tổng tiền</th><th>Trạng thái</th></tr></thead><tbody><tr th:each="o : ${orders}"><td th:text="${o.id}"></td><td th:text="${#temporals.format(o.orderDate, 'dd/MM/yyyy HH:mm')}"></td><td th:text="${#numbers.formatDecimal(o.totalAmount,0,'COMMA',0,'POINT')} + ' đ'"></td><td th:text="${o.status}"></td></tr></tbody></table></div></body></html>
