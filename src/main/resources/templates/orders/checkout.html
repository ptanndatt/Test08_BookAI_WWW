<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="stylesheet" href="/css/style.css"><title>Thanh toán</title></head><body><div class="nav"><a href="/books">BookStore AI</a><div><a href="/books">Sách</a><a href="/ai">Hỏi AI</a><a href="/orders/my">Đơn hàng</a><a href="/admin/books">Admin</a><a href="/login">Đăng nhập</a><form th:action="@{/logout}" method="post" style="display:inline"><button class="linkbtn">Đăng xuất</button></form></div></div>
<div class="container small"><h1>Thanh toán</h1><div class="alert" th:if="${error}" th:text="${error}"></div>
<div class="card"><h2 th:text="${book.title}"></h2><p th:text="'Tác giả: ' + ${book.author}"></p><p class="price" th:text="${#numbers.formatDecimal(book.price,0,'COMMA',0,'POINT')} + ' đ'"></p><p th:text="'Tồn kho: ' + ${book.quantity}"></p>
<form th:action="@{/orders/buy}" method="post" class="form"><input type="hidden" name="bookId" th:value="${book.id}"><label>Số lượng mua</label><input type="number" name="quantity" value="1" min="1" required><button>Thanh toán</button></form></div></div></body></html>
