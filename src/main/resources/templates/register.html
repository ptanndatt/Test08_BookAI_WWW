<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Đăng ký</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body>
<div th:replace="fragments/header :: header"></div>
<main class="page"><section class="card form-card"><h1>Đăng ký tài khoản</h1><p class="sub-title">Tài khoản đăng ký mới mặc định là USER.</p><p class="error" th:if="${error}" th:text="${error}"></p><form th:action="@{/register}" method="post" th:object="${user}" class="nice-form"><label>Tên đăng nhập</label><input type="text" th:field="*{username}" required><label>Mật khẩu</label><input type="password" th:field="*{password}" required><button class="btn-primary" type="submit">Đăng ký</button><a class="btn-secondary text-center" th:href="@{/login}">Đã có tài khoản</a></form></section></main>
</body>
</html>
